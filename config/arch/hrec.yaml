# ---------- model wiring ----------
name: recursive_reasoning.single_cycle@HRec

# ---------- backbone ----------
hidden_size: 512
num_heads: 8
expansion: 4
dropout: 0.1
n_layers: 15

# ---------- recursion ----------
recursion_steps: 3            
detach_till_last: True   # run with no grads until the last step
deep_supervision: False   # we average loss across all recursion steps 
residual_update: False    # add a residual for recursive latent 
state_scale_init: 0.1     # 