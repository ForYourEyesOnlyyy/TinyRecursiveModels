# ---------- model wiring ----------
name: recursive_reasoning.recurrent_transformer@HRecTransformer

# ---------- backbone ----------
hidden_size: 512
num_heads: 8
expansion: 4
dropout: 0.1
n_layers: 6

# ---------- recursion ----------
recursion_steps: 6            
detach_till_last: False   
deep_supervision: False  
residual_update: False 
state_scale_init: 0.1