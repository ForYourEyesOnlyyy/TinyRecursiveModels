defaults:
  - arch: transformers_baseline
  - _self_

project_name: sudoku_baseline

# data
data_paths: ['data/sudoku-extreme-1k-aug-1000']
data_split_train: "train"
data_split_eval: "test"
blank_id: 1
global_batch_size: 256              # total examples per batch (single GPU)
max_eval_batches: 4

# optimizer
lr: 1e-3
lr_min_ratio: 1.0                   # 1.0 = flat; <1.0 = cosine decay
lr_warmup_steps: 2000
weight_decay: 0.1
beta1: 0.9
beta2: 0.95

# training
seed: 42
epochs: 5000                       # total epochs
eval_interval: 100                 # evaluate every N epochs

device: auto  # cpu | cuda | mps | auto

# Checkpointing
checkpoint_dir: null         # default resolved to "checkpoints/<project>/<run_name>"
save_every: ${eval_interval} # save last.ckpt every N epochs (or pick a number)
save_best: true              # also save best.ckpt by metric
resume: true                 # resume if load_checkpoint is set
load_checkpoint: null        # set to a .ckpt path to resume
best_metric: "eval_acc_blank"
best_mode: "max"             # "max" or "min"

# wandb
wandb:
  group: 1_rec_cycle
  enabled: true
  project: sudoku_baseline
  entity: mrtshv-innopolis-university
  mode: online  # or offline / disabled
