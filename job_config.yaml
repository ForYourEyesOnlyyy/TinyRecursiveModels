name: sudoku-trm-train
desc: Train TRM on Sudoku Extreme using Hydra configs + W&B logging

cmd: |
  python3 train_job.py \
    arch=trm \
    data_paths="['data/sudoku-extreme-1k-aug-1000']" \
    epochs=3 \
    eval_interval=20 \
    lr=1e-3 \
    weight_decay=0.1 \
    global_batch_size=128 \
    wandb.group="sandbox" \
    +run_name=test_job

inputs:
  - config/cfg_pretrain.yaml
  - config/arch/
  - models/
  - data/sudoku-extreme-1k-aug-1000

outputs:
  - checkpoints/
  - wbd_logs/

env:
  docker:
    image: mrtshv/trm-env:latest
  python:
    type: manual
    version: "3.11"
    requirements-file: job_reqs.txt
  vars:
    - WANDB_API_KEY
    - PYTHONUNBUFFERED: "1"

flags:
  - attach-project-disk

cloud-instance-types:
  - g2.1

graceful-shutdown:
  signal: SIGTERM
  timeout: 20s